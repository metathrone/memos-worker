name: Auto Sync & Deploy to Cloudflare Workers

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  sync-and-deploy:
    name: Sync Upstream & Deploy memos-worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Upstream (souvenp/memos-worker)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/souvenp/memos-worker.git 2>/dev/null || true
          git fetch upstream master

          UPSTREAM_DIFF=$(git rev-list HEAD..upstream/master --count 2>/dev/null || echo "0")
          echo "上游领先提交数: $UPSTREAM_DIFF"

          if [ "$UPSTREAM_DIFF" -gt 0 ]; then
            echo "发现上游更新，正在合并..."
            git merge upstream/master --no-edit || {
              echo "检测到冲突，保留本地配置与工作流..."
              git checkout --ours wrangler.toml cloudflare.config.ts package.json package-lock.json .github/ 2>/dev/null || true
              git add -A
              git commit -m "chore: 解决上游合并冲突并保留本地配置" || true
            }
            git push origin master
          else
            echo "当前代码已与上游保持同步。"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Deploy with cf CLI
        run: npx cf deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
