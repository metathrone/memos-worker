name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"

routes = [
  { pattern = "memos.rushia.eu.org", custom_domain = true }
]

[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*",
	"/rss.xml",
	"/explore/rss.xml"
]

[[d1_databases]]
binding = "DB"
database_id = "ec18ab97-d7f5-4960-8e9f-1ef3e7cc0d78"
database_name = "notes-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "ae897c2fc66844b08c6cd9177c708a19"

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
